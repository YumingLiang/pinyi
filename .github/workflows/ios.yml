# macOS：XcodeGen 生成工程 → iOS 模拟器 build + 单元测试（技术方案 §11.3 ios.yml）。
# ⚠️ 草稿：在 Linux 上编写，未在任何 macOS runner 上运行过。首次运行时需核对：
#   - runner：`macos-26`（arm64 标准 runner，= 当前 macos-latest）。2026-11-16 按 actions/runner-images
#     images/macos/macos-26-arm64-Readme.md（Image 20261102.0473.1，macOS 26.7.2）核实：默认 Xcode 26.6（17F113，
#     自带 Swift 6.3.3，iOS 26.5 SDK），路径 /Applications/Xcode_26.6.app；另有 26.0.1–26.5。
#     Xcode 27 只在预览 runner `xcode-27` 上，暂不用。技术方案 §9.1：上传 App Store Connect 须 Xcode 26 + iOS 26 SDK。
#   - XcodeGen 对本地包测试目标（`package: MosaicCore/MosaicCoreTests`）的支持；
#   - 模拟器设备选择脚本。
# 费用：标准 macOS runner 约 0.062 美元/分钟（私有仓库从包含额度扣除），因此用 paths 过滤 + 并发取消控制触发。
name: ios

on:
  pull_request:
    paths:
      - "App/**"
      - "AppTests/**"
      - "UITests/**"
      - "Packages/MosaicAppCore/**"
      - "Packages/MosaicAccelerate/**"
      - "fastlane/**"
      - "project.yml"
      - ".github/workflows/ios.yml"
      # 纯 MosaicCore 变化只跑 linux-core（技术方案 §11.3）。
  workflow_dispatch:
  # 没开 PR 的 feat/** 分支推送时只跑 Xcode 27.2 不签名编译（ios-xcode27-build），给并行分支一个快速编译反馈。
  # 已开 PR 的分支已经由 pull_request 触发，这里排除，避免重复跑；以后新开 PR 的分支请在这里加一行排除。
  push:
    branches:
      - "feat/**"
      - "!feat/app-layer"
      - "!feat/mosaic-core-io-cancel"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios-simulator:
    name: iOS build + test (simulator)
    if: github.event_name != 'push'
    runs-on: macos-26            # 已核实（见文件头）；钉具体版本，不用 macos-latest 以免镜像迁移时无声换 Xcode
    timeout-minutes: 30
    env:
      # 钉具体 Xcode（与 linux-core.yml 的 swift:6.3.3-noble 同为 Swift 6.3.3）。runner 只保留每个 minor 的最新 patch，
      # 镜像移除 26.6 时这里会明确失败，再按 runner-images 的 Readme 更新。
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Check Xcode 26.6
        run: |
          if [ ! -d "$DEVELOPER_DIR" ]; then
            echo "::error::$DEVELOPER_DIR not found on runner"; ls -d /Applications/Xcode*.app; exit 1
          fi
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          d = json.load(sys.stdin)["devices"]
          def ver(rt):
              m = re.search(r"iOS-(\d+)-(\d+)", rt)
              return (int(m.group(1)), int(m.group(2))) if m else (-1, -1)
          for rt in sorted((r for r in d if "iOS" in r), key=ver, reverse=True):
              for dev in d[rt]:
                  if dev.get("isAvailable") and dev["name"].startswith("iPhone"):
                      print(dev["udid"]); sys.exit(0)
          sys.exit("no available iPhone simulator")
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$UDID"

      # 无外部依赖，暂不缓存 SPM；DerivedData 缓存可在构建时间成为瓶颈后再加（key 含 project.yml 哈希）。
      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project PhotoMosaic.xcodeproj \
            -scheme Pinyi \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            | tee xcodebuild-build.log

      - name: Unit tests (App + MosaicCore on simulator)
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project PhotoMosaic.xcodeproj \
            -scheme Pinyi \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults.xcresult \
            | tee xcodebuild-test.log

      # UI 冒烟测试（占位，T9 之后启用）：
      #   xcrun simctl addmedia <udid> Fixtures/Photos/*.jpg
      #   xcrun simctl privacy <udid> grant photos <bundle-id>
      #   xcodebuild test-without-building ... -only-testing:PhotoMosaicUITests

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: |
            TestResults.xcresult
            xcodebuild-*.log
          retention-days: 7

  # Release / Internal 两种配置都做真机架构编译（不签名），并检查内部工具标记：
  # Release 产物里有 PINYI_INTERNAL_TOOLS_MARKER → 失败；Internal 产物里没有 → 失败。
  # 合并自运维草稿 /workspace/pinyi/ios-release/ci-ios-job.yml（改动：runner/Xcode 钉 macos-26 + 26.6、工程名
  # PhotoMosaic.xcodeproj、加 xcodegen 安装步骤拆分、显示名检查、set -euo pipefail）。提审不在任何自动流程里。
  ios-config-guard:
    name: iOS ${{ matrix.configuration }} build + INTERNAL_TOOLS guard
    if: github.event_name != 'push'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    strategy:
      fail-fast: false
      matrix:
        include:
          - { scheme: Pinyi, configuration: Release, expect_marker: "0", display_name: "拼忆" }
          - { scheme: Pinyi-Internal, configuration: Internal, expect_marker: "1", display_name: "拼忆内测" }
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build ${{ matrix.configuration }} (generic iOS, unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project PhotoMosaic.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -configuration "${{ matrix.configuration }}" \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            | tee "xcodebuild-${{ matrix.configuration }}.log"

      - name: Guard INTERNAL_TOOLS marker and display name
        env:
          CONFIGURATION: ${{ matrix.configuration }}
          EXPECT_MARKER: ${{ matrix.expect_marker }}
          EXPECT_NAME: ${{ matrix.display_name }}
        run: |
          set -euo pipefail
          APP=$(ls -d "build/Build/Products/${CONFIGURATION}-iphoneos/"*.app | head -n 1)
          EXE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")
          NAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist")
          if strings -a "$APP/$EXE" | grep -q PINYI_INTERNAL_TOOLS_MARKER; then FOUND=1; else FOUND=0; fi
          echo "configuration=$CONFIGURATION marker=$FOUND displayName=$NAME"
          if [ "$FOUND" != "$EXPECT_MARKER" ]; then
            echo "::error::$CONFIGURATION: INTERNAL_TOOLS marker found=$FOUND, expected=$EXPECT_MARKER"; exit 1
          fi
          if [ "$NAME" != "$EXPECT_NAME" ]; then
            echo "::error::$CONFIGURATION: CFBundleDisplayName=$NAME, expected=$EXPECT_NAME"; exit 1
          fi
          # InfoPlist.strings 不得再覆盖显示名（否则内测包在 zh-Hans 下仍显示「拼忆」）
          if [ -f "$APP/zh-Hans.lproj/InfoPlist.strings" ] && plutil -p "$APP/zh-Hans.lproj/InfoPlist.strings" | grep -q CFBundleDisplayName; then
            echo "::error::InfoPlist.strings overrides CFBundleDisplayName"; exit 1
          fi

  # 与 AndyL 本机 Xcode 27.2 对齐：不签名，只编 Release / Internal，提前拦住新编译器（Swift 6 region isolation 等）的报错。
  # Xcode 27 只在 GitHub 的预览镜像 `xcode-27`（macOS 27，arm64）上有；2026-11-16 按 runner-images
  # images/macos/xcode-27-arm64-Readme.md（Image 20261104.0337.1）核实：Xcode 27.2（27B52）在 /Applications/Xcode_27.2.app，默认是 27.1。
  # 预览镜像可能排队较久或变动；镜像移除 27.2 时这里会明确失败，再按 Readme 更新。公开仓库标准 runner 不收费。
  ios-xcode27-build:
    name: iOS ${{ matrix.configuration }} build (Xcode 27.2, unsigned)
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    strategy:
      fail-fast: false
      matrix:
        include:
          - { scheme: Pinyi, configuration: Release }
          - { scheme: Pinyi-Internal, configuration: Internal }
    steps:
      - uses: actions/checkout@v4

      - name: Check Xcode 27.2
        run: |
          if [ ! -d "$DEVELOPER_DIR" ]; then
            echo "::error::$DEVELOPER_DIR not found on runner"; ls -d /Applications/Xcode*.app; exit 1
          fi
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build ${{ matrix.configuration }} (generic iOS, unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project PhotoMosaic.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -configuration "${{ matrix.configuration }}" \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            | tee "xcodebuild-x27-${{ matrix.configuration }}.log"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcode27-${{ matrix.configuration }}
          path: xcodebuild-x27-*.log
          retention-days: 7

  # ---------------------------------------------------------------------------
  # TestFlight：fastlane/Fastfile（lane beta_internal = Internal 配置、仅内部组、不提审；lane release 以后用）。
  # 发布 workflow 由运维负责（不在本仓库自动流程里），需要 AndyL 先完成：Apple Developer 账号、
  # App Store Connect API Key、Bundle ID、App 记录、match 证书私有仓库；GitHub Secrets 名称（值绝不入库）：
  #   APP_STORE_CONNECT_API_KEY_KEY_ID / APP_STORE_CONNECT_API_KEY_ISSUER_ID / APP_STORE_CONNECT_API_KEY_KEY /
  #   MATCH_GIT_URL / MATCH_PASSWORD / PINYI_BUNDLE_ID（可选 PINYI_TEAM_ID、TF_INTERNAL_GROUP）
  # ---------------------------------------------------------------------------
